syntax = "proto3";

package paranoid_crypto.lib.data;

// Data used on CheckKeypairDenylist for detecting RSA keys vulnerable to
// CVE-2021-41117. The table field is a map of the 64 most significant bits
// of the modulus into metadata with enough information for reconstructing the
// primes. See GetKeyPairTable method in storage.py and default_storage.py for
// more details.
message KeypairData {
  map<uint64, bytes> table = 1;
}

// Per-curve sorted lookup table used by CheckOpensslDenylistEC for detecting EC
// public keys generated by Debian/Ubuntu's crippled OpenSSL 0.9.8c-0.9.8g PRNG
// (CVE-2008-0166). For N generated weak keys on a curve, entries are sorted by
// the 32 least significant bits of the affine x-coordinate:
//   - x_lsb32: N little-endian uint32 values (4 * N bytes).
//   - meta_hi: N uint8 values storing (meta >> 16) (N bytes).
//   - meta_lo: N little-endian uint16 values storing (meta & 0xffff) (2 * N
//     bytes), where meta = (config_index << 15) | pid.
message OpensslDenylistECCurveTable {
  bytes x_lsb32 = 1;
  bytes meta_hi = 2;
  bytes meta_lo = 3;
}

// Maps CurveType enum values to their CVE-2008-0166 lookup tables.
message OpensslDenylistECData {
  map<int32, OpensslDenylistECCurveTable> curve_tables = 1;
}

// Per-curve lookup table used by CheckUnseededRandEC for detecting EC public
// keys generated from unseeded/default-seeded PRNGs or deterministic zero/weak
// seeds. Maps the 64 least significant bits of the affine x-coordinate to the
// big-endian private scalar bytes d (or concatenated scalars if multiple weak
// keys ever shared a 64-bit suffix).
message UnseededRandsECCurveTable {
  map<uint64, bytes> x_lsb64_to_d = 1;
}

// Maps CurveType enum values to their unseeded-PRNG lookup tables.
message UnseededRandsECData {
  map<int32, UnseededRandsECCurveTable> curve_tables = 1;
}
